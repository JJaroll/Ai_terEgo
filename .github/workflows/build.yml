name: Build AIterEgo Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- BLOQUE WINDOWS: WEB INSTALLER ---
      - name: Create Windows Setup
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          choco install innosetup -y
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # --- BLOQUE MAC: WEB INSTALLER (PKG Nativo) ---
      - name: Create Mac PKG
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p root/Applications/AIterEgo.app/Contents/MacOS
          mkdir -p root/Applications/AIterEgo.app/Contents/Resources
          cp -r *.py assets avatars requirements.txt root/Applications/AIterEgo.app/Contents/Resources/
          cp install_env.sh root/Applications/AIterEgo.app/Contents/MacOS/AIterEgo_Launcher
          chmod +x root/Applications/AIterEgo.app/Contents/MacOS/AIterEgo_Launcher
          cp assets/app_icon.icns root/Applications/AIterEgo.app/Contents/Resources/
          
          # Script postinstall para ejecutar la descarga inicial
          echo "#!/bin/bash" > postinstall.sh
          echo "sh /Applications/AIterEgo.app/Contents/MacOS/AIterEgo_Launcher" >> postinstall.sh
          chmod +x postinstall.sh
          
          pkgbuild --root root --identifier "com.jjaroll.aiterego" --version "1.1.1" --install-location / --scripts . "AIterEgo_Installer.pkg"
          codesign --force --sign - --deep "AIterEgo_Installer.pkg"

      # --- BLOQUE LINUX: WEB INSTALLER (.RUN) ---
      - name: Create Linux Run Installer
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir AIterEgo_Linux
          cp -r *.py assets avatars requirements.txt install_env.sh AIterEgo_Linux/
          chmod +x AIterEgo_Linux/install_env.sh
          
          sudo apt-get update
          sudo apt-get install makeself -y
          
          makeself AIterEgo_Linux/ AIterEgo_Linux_WebInstaller.run "Instalador de AIterEgo" ./install_env.sh

      # --- SUBIDA DE ARTEFACTOS ---
      - name: Upload Windows Setup
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-Windows, path: Output/AIterEgo_Windows_WebInstaller.exe }

      - name: Upload Mac PKG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-macOS, path: AIterEgo_Installer.pkg }

      - name: Upload Linux Run
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-Linux, path: AIterEgo_Linux_WebInstaller.run }