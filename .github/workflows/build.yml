name: Build AIterEgo Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- BLOQUE WINDOWS: WEB INSTALLER ---
      - name: Create Windows Setup
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # --- BLOQUE MAC: FIRMA Y DMG ---
      - name: Sign and Create DMG
        if: matrix.os == 'macos-latest'
        run: |
          plutil -insert NSMicrophoneUsageDescription -string "AIterEgo necesita acceso al micrófono para interactuar contigo mediante voz." "dist/AIterEgo.app/Contents/Info.plist"
          
          codesign --force --deep --sign - --entitlements entitlements.plist "dist/AIterEgo.app"
          
          brew install create-dmg
          create-dmg \
            --volname "AIterEgo Installer" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            --icon "AIterEgo.app" 200 200 \
            "AIterEgo_Installer.dmg" \
            "dist/AIterEgo.app"

      # --- BLOQUE LINUX: APPIMAGE ---
      - name: Create Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AIterEgo.AppDir/usr/bin
          cp -r dist/AIterEgo/* AIterEgo.AppDir/usr/bin/
          cp assets/IA.png AIterEgo.AppDir/IA.png
          ln -s usr/bin/AIterEgo AIterEgo.AppDir/AppRun
          printf '%s\n' \
            "[Desktop Entry]" \
            "Type=Application" \
            "Name=AIterEgo" \
            "Exec=AIterEgo" \
            "Icon=IA" \
            "Categories=Utility;" > AIterEgo.AppDir/AIterEgo.desktop
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AIterEgo.AppDir AIterEgo-Linux.AppImage

      # --- UPLOADS CONDICIONALES ---
      - name: Upload DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-macOS, path: AIterEgo_Installer.dmg }

      - name: Upload Windows Setup
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with: 
          name: AIterEgo-Windows
          path: Output\AIterEgo_Windows_Installer.exe

      - name: Upload AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-Linux, path: AIterEgo-Linux.AppImage }
 # --- FIN ---