name: Build AIterEgo Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- BLOQUE WINDOWS: WEB INSTALLER ---
      - name: Create Windows Setup
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          curl -L -o python-embed.zip https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          choco install innosetup -y
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # --- PREPARACIÓN PARA MAC Y LINUX ---
      - name: Set up Python
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PortAudio (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev
          else
            brew install portaudio
          fi

      - name: Install dependencies (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Mac/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          EXTRA_ARGS=()
          if [ "$RUNNER_OS" == "macOS" ]; then
            SEP=":"
            ICON="assets/app_icon.icns"
            EXTRA_ARGS+=(--osx-bundle-identifier "com.jjaroll.aiterego")
          else
            SEP=":"
            ICON="assets/IA.png"
          fi
          
          pyinstaller --noconfirm --onedir --windowed --name "AIterEgo" \
            --add-data "assets${SEP}assets" \
            --add-data "avatars${SEP}avatars" \
            --icon "$ICON" \
            --collect-all transformers \
            --hidden-import numpy \
            --hidden-import pyaudio \
            "${EXTRA_ARGS[@]}" \
            main.py
            
          # LISTAR ARCHIVOS PARA DEPURAR
          echo "Contenido de dist:"
          ls -R dist/

      # --- BLOQUE MAC: FIRMA Y DMG ---
      - name: Sign and Create DMG
        if: matrix.os == 'macos-latest'
        run: |
          plutil -insert NSMicrophoneUsageDescription -string "AIterEgo necesita acceso al micrófono para interactuar contigo mediante voz." "dist/AIterEgo.app/Contents/Info.plist"
          
          codesign --force --deep --sign - --entitlements entitlements.plist "dist/AIterEgo.app"
          
          brew install create-dmg
          create-dmg \
            --volname "AIterEgo Installer" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 200 \
            --icon "AIterEgo.app" 200 200 \
            "AIterEgo_Installer.dmg" \
            "dist/AIterEgo.app"

      # --- BLOQUE LINUX: DOCKERIZED APPIMAGE ---
      - name: Build Linux AppImage in Docker
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -t aiterego-builder .
          docker run --rm -v $(pwd):/app aiterego-builder
        
      # --- UPLOADS CONDICIONALES ---
      - name: Upload DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-macOS, path: AIterEgo_Installer.dmg }

      - name: Upload Windows Setup
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with: 
          name: AIterEgo-Windows
          path: Output\AIterEgo_Windows_WebInstaller.exe

      - name: Upload AppImage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with: { name: AIterEgo-Linux, path: AIterEgo-Linux.AppImage }
 # --- FIN ---